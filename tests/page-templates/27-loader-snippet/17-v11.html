<%= header %>
<script>
/* eslint-disable */
(function() {
    // Boomerang Loader Snippet version 11
    if (window.BOOMR && (window.BOOMR.version || window.BOOMR.snippetExecuted)) {
        return;
    }

    window.BOOMR = window.BOOMR || {};
    window.BOOMR.snippetExecuted = true;

    // NOTE: Set Boomerang URL here
    window.BOOMR.url = "../../build/boomerang-latest-debug.js";

    var // document.currentScript is supported in all browsers other than IE
        where = document.currentScript || document.getElementById("boomerang-loader-script"),
        // Whether or not Preload method has worked
        promoted = false,
        // How long to wait for Preload to work before falling back to iframe method
        LOADER_TIMEOUT = 3000;

    // Tells the browser to execute the Preloaded script by adding it to the DOM
    function promote() {
        var script = document.createElement("script");
        script.id = "boomr-scr-as";
        script.src = this.href;

        // Not really needed since dynamic scripts are async by default and the script is already in cache at this point,
        // but some naive parsers will see a missing async attribute and think we're not async
        script.async = true;

        where.parentNode.appendChild(script);

        promoted = true;
    }

    // Non-blocking iframe loader (fallback for non-Preload scenarios) for all recent browsers.
    // For IE 6/7, falls back to dynamic script node.
    function iframeLoader() {
        promoted = true;

        var dom, doc, iframe = document.createElement("iframe"), win = window;

        // Save when the onload event happened, in case this is a non-NavigationTiming browser
        function boomerangSaveLoadTime(e) {
            win.BOOMR_onload = (e && e.timeStamp) || new Date().getTime();
        }

        if (win.addEventListener) {
            win.addEventListener("load", boomerangSaveLoadTime, false);
        } else if (win.attachEvent) {
            win.attachEvent("onload", boomerangSaveLoadTime);
        }

        iframe.src = "javascript:void(0)";
        iframe.title = "";
        iframe.role = "presentation";
        (iframe.frameElement || iframe).style.cssText = "width:0;height:0;border:0;display:none;";
        where.parentNode.insertBefore(iframe, where);

        // Try to get the iframe's document object
        try {
            win = iframe.contentWindow;
        }
        catch (e) {
            dom = document.domain;
            iframe.src = "javascript:var d=document.open();d.domain='" + dom + "';void(0);";
            win = iframe.contentWindow;
        }

        win.document.open();

        win._boomrl = function() {
            var js = win.document.createElement("script");
            if (dom) {
                win.document.domain = dom;
            }
            js.id = "boomr-if-as";
            js.src = boomr_url;
            BOOMR_lstart = new Date().getTime();
            win.document.body.appendChild(js);
        };

        if (win.addEventListener) {
            win.addEventListener("load", win._boomrl, false);
        } else if (win.attachEvent) {
            win.attachEvent("onload", win._boomrl);
        }

        // Finish the document
        win.document.close();
    }

    // See if Preload is supported or not
    var link = document.createElement("link");

    if (link.relList &&
        typeof link.relList.supports === "function" &&
        link.relList.supports("preload") &&
        ("as" in link)) {

        // Set attributes to trigger a Preload
        link.href = window.BOOMR.url;
        link.rel  = "preload";
        link.as   = "script";

        // Add our script tag if successful, fallback to iframe if not
        link.addEventListener("load", promote);
        link.addEventListener("error", iframeLoader);

        // Have a fallback in case Preload does nothing or is slow
        setTimeout(function() {
            if (!promoted) {
                iframeLoader();
            }
        }, LOADER_TIMEOUT);

        // Append our link tag
        where.parentNode.appendChild(link);
    }
    else {
        // No Preload support, use iframe loader
        iframeLoader();
    }

    if (window.addEventListener) {
        window.addEventListener("message", function(e) {
            if (e && e.data && e.data.boomr_mq) {
                window.BOOMR_mq = window.BOOMR_mq || [];
                window.BOOMR_mq.push(e.data.boomr_mq);
            }
        });
    }
})();
</script>
<script src="17-v11.js" type="text/javascript"></script>

BOOMR_test.init({

});
